name: POSTAL · dades i publicació

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Instal·lar osmium
        if: github.event_name != 'push'
        run: sudo apt-get update && sudo apt-get install -y osmium-tool
      - name: Generar bústies d'Espanya i Portugal
        if: github.event_name != 'push'
        run: |
          bash scripts/build-data.sh es
          bash scripts/build-data.sh pt
      - name: Desar les dades al repositori
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add public/data/
          git diff --cached --quiet || git commit -m "Dades: actualització de bústies"
          git push

      - name: Compilar
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
